<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Final Fantasy X - osu!mania Team</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #080b12;
      --panel-bg: rgba(13, 19, 33, 0.75);
      --panel-border: rgba(99, 179, 237, 0.2);
      --accent-glow: #63b3ed;
      --text-main: #e2e8f0;
      --text-muted: #a0aec0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
    }

    #pyreflies {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .container {
      width: 100%;
      max-width: 700px;
      position: relative;
      z-index: 2;
    }

    .hero {
      text-align: center;
      padding: 40px 20px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      backdrop-filter: blur(10px);
      margin-bottom: 24px;
    }

    .hero h1 {
      font-family: 'Cinzel', serif;
      font-size: 2.2rem;
      letter-spacing: 2px;
      color: #fff;
      text-shadow: 0 0 12px var(--accent-glow);
      margin-bottom: 6px;
    }

    .hero p {
      color: var(--text-muted);
      font-size: 0.95rem;
      letter-spacing: 1px;
    }

    .card {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 24px;
      backdrop-filter: blur(10px);
      margin-bottom: 24px;
    }

    .card h2 {
      font-family: 'Cinzel', serif;
      font-size: 1.2rem;
      color: var(--accent-glow);
      margin-bottom: 16px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input, textarea {
      width: 100%;
      padding: 10px 12px;
      background: rgba(8, 11, 18, 0.8);
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      color: #fff;
      font-family: inherit;
      font-size: 0.95rem;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: var(--accent-glow);
      box-shadow: 0 0 8px rgba(99, 179, 237, 0.3);
    }

    button {
      background: #3182ce;
      color: #fff;
      border: none;
      padding: 10px 20px;
      font-family: 'Cinzel', serif;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    button:hover {
      background: #4299e1;
    }

    .message-item {
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding: 14px 0;
    }

    .message-item:last-child {
      border-bottom: none;
    }

    .message-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .author-name {
      font-weight: 600;
      color: #ecc94b;
    }

    .timestamp {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .message-body {
      font-size: 0.9rem;
      color: var(--text-main);
    }
  </style>
</head>
<body>

  <canvas id="pyreflies"></canvas>

  <div class="container">
    <div class="hero">
      <h1>FINAL FANTASY X</h1>
      <p>Welcome to the official osu!mania team page.</p>
    </div>

    <div class="card">
      <h2>Leave a Message</h2>
      <form id="guestbook-form">
        <div class="form-group">
          <label for="username">osu! Username</label>
          <input type="text" id="username" placeholder="Your username" required>
        </div>
        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" rows="3" placeholder="Leave a note..." required></textarea>
        </div>
        <button type="submit">Submit</button>
      </form>
    </div>

    <div class="card">
      <h2>Messages</h2>
      <div id="messages-list">
        <p style="color: var(--text-muted); font-size: 0.85rem;">No messages yet.</p>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('pyreflies');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor() { this.reset(); }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2 + 1;
        this.speedX = (Math.random() - 0.5) * 0.3;
        this.speedY = (Math.random() - 0.5) * 0.3 - 0.15;
        this.alpha = Math.random() * 0.5 + 0.2;
      }
      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) this.reset();
      }
      draw() {
        ctx.fillStyle = `rgba(154, 230, 255, ${this.alpha})`;
        ctx.shadowBlur = 6;
        ctx.shadowColor = '#63b3ed';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    for (let i = 0; i < 35; i++) particles.push(new Particle());

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => { p.update(); p.draw(); });
      requestAnimationFrame(animate);
    }
    animate();

    const form = document.getElementById('guestbook-form');
    const messagesList = document.getElementById('messages-list');

    function loadMessages() {
      const stored = JSON.parse(localStorage.getItem('ffx_team_messages') || '[]');
      if (stored.length === 0) return;

      messagesList.innerHTML = stored.map(msg => `
        <div class="message-item">
          <div class="message-header">
            <span class="author-name">${escapeHtml(msg.username)}</span>
            <span class="timestamp">${msg.time}</span>
          </div>
          <div class="message-body">${escapeHtml(msg.text)}</div>
        </div>
      `).join('');
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[m]);
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const text = document.getElementById('message').value.trim();
      if (!username || !text) return;

      const newMessage = {
        username,
        text,
        time: new Date().toLocaleDateString()
      };

      const stored = JSON.parse(localStorage.getItem('ffx_team_messages') || '[]');
      stored.unshift(newMessage);
      localStorage.setItem('ffx_team_messages', JSON.stringify(stored));

      document.getElementById('message').value = '';
      loadMessages();
    });

    loadMessages();
  </script>
</body>
</html>
